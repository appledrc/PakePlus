    // ---------- 数据库操作函数 ----------
    function openDB() {
        return new Promise((resolve, reject) => {
            console.log('正在打开数据库...');
            try {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                
                request.onerror = (e) => {
                    console.error('数据库打开失败:', e.target.error);
                    reject(e);
                };
                
                request.onsuccess = (e) => { 
                    db = e.target.result;
                    console.log('数据库打开成功');
                    resolve(db); 
                };
                
                request.onupgradeneeded = (e) => {
                    console.log('数据库升级/创建中...');
                    const db = e.target.result;
                    
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        const store = db.createObjectStore(STORE_NAME, { keyPath: 'timestamp' });
                        store.createIndex('datetime', 'datetime', { unique: false });
                        console.log('创建 bills 仓库');
                    }
                    
                    if (!db.objectStoreNames.contains(BUTTON_STORE_NAME)) {
                        db.createObjectStore(BUTTON_STORE_NAME, { keyPath: 'id' });
                        console.log('创建 buttons 仓库');
                    }
                    
                    // 新增轮播配置存储仓库
                    if (!db.objectStoreNames.contains(SLIDESHOW_STORE_NAME)) {
                        db.createObjectStore(SLIDESHOW_STORE_NAME, { keyPath: 'id' });
                        console.log('创建 slideshow 仓库');
                    }
                };
            } catch (e) {
                console.error('数据库打开异常:', e);
                reject(e);
            }
        });
    }

    function getAllBills() { 
        return new Promise((resolve, reject) => { 
            if (!db) {
                console.warn('数据库未就绪');
                return resolve([]);
            }
            try {
                const tx = db.transaction(STORE_NAME, 'readonly'); 
                const store = tx.objectStore(STORE_NAME); 
                const req = store.getAll(); 
                req.onsuccess = () => resolve(req.result || []); 
                req.onerror = (e) => reject(e);
            } catch (e) {
                console.error('获取账单失败:', e);
                resolve([]);
            }
        }); 
    }
    
    function addBills(records) { 
        return new Promise((resolve, reject) => { 
            if (!db || !records.length) return resolve([]); 
            try {
                const tx = db.transaction(STORE_NAME, 'readwrite'); 
                const store = tx.objectStore(STORE_NAME); 
                let added = 0; 
                records.forEach(r => { 
                    const req = store.add(r); 
                    req.onsuccess = () => { 
                        added++; 
                        if (added === records.length) resolve(records.map(x => x.timestamp)); 
                    }; 
                    req.onerror = (e) => { 
                        console.error('添加账单失败:', e);
                        added++; 
                        if (added === records.length) reject(e); 
                    }; 
                });
            } catch (e) {
                console.error('添加账单异常:', e);
                reject(e);
            }
        }); 
    }
    
    function deleteBill(timestamp) { 
        return new Promise((resolve, reject) => { 
            if (!db) return reject('DB not ready'); 
            try {
                const tx = db.transaction(STORE_NAME, 'readwrite'); 
                const store = tx.objectStore(STORE_NAME); 
                const req = store.delete(timestamp); 
                req.onsuccess = () => resolve(timestamp); 
                req.onerror = (e) => reject(e);
            } catch (e) {
                reject(e);
            }
        }); 
    }
    
    function updateBill(record) { 
        return new Promise((resolve, reject) => { 
            if (!db) return reject('DB not ready'); 
            try {
                const tx = db.transaction(STORE_NAME, 'readwrite'); 
                const store = tx.objectStore(STORE_NAME); 
                const req = store.put(record); 
                req.onsuccess = () => resolve(record.timestamp); 
                req.onerror = (e) => reject(e);
            } catch (e) {
                reject(e);
            }
        }); 
    }
    
    function updateBillNames(oldName, newName) { 
        return new Promise(async (resolve, reject) => { 
            try { 
                const all = await getAllBills(); 
                const toUpdate = all.filter(r => r.name === oldName); 
                if (!toUpdate.length) return resolve(0); 
                const tx = db.transaction(STORE_NAME, 'readwrite'); 
                const store = tx.objectStore(STORE_NAME); 
                let updated = 0; 
                toUpdate.forEach(rec => { 
                    rec.name = newName; 
                    const req = store.put(rec); 
                    req.onsuccess = () => { 
                        updated++; 
                        if (updated === toUpdate.length) resolve(updated); 
                    }; 
                }); 
            } catch (e) { 
                reject(e); 
            } 
        }); 
    }
    
    function saveButtonConfigsToDB(configs) { 
        return new Promise((resolve, reject) => { 
            if (!db) return reject('DB not ready'); 
            try {
                const tx = db.transaction(BUTTON_STORE_NAME, 'readwrite'); 
                const store = tx.objectStore(BUTTON_STORE_NAME); 
                store.clear().onsuccess = () => { 
                    store.add({ id: 1, configs: configs }).onsuccess = () => resolve(); 
                };
            } catch (e) {
                reject(e);
            }
        }); 
    }

                const tx = db.transaction(BUTTON_STORE_NAME, 'readonly'); 
                const store = tx.objectStore(BUTTON_STORE_NAME); 
                const req = store.get(1); 
                req.onsuccess = () => resolve(req.result ? req.result.configs : null); 
                req.onerror = (e) => reject(e);
            } catch (e) {
                reject(e);

    }

    function showConfirm(message, onConfirm) { 
        customConfirmMessage.innerText = message; 
        customConfirmOverlay.style.display = 'flex'; 
        const confirmHandler = () => { 
            customConfirmOverlay.style.display = 'none'; 
            onConfirm(true); 
            cleanup(); 
        }; 
        const cancelHandler = () => { 
            customConfirmOverlay.style.display = 'none'; 
            onConfirm(false); 
            cleanup(); 
        }; 
        const cleanup = () => { 
            customConfirmOk.removeEventListener('click', confirmHandler); 
            customConfirmCancel.removeEventListener('click', cancelHandler); 
        }; 
        customConfirmOk.addEventListener('click', confirmHandler); 
        customConfirmCancel.addEventListener('click', cancelHandler); 
    }
    
    async function exportData() { 
        try { 
            const bills = await getAllBills(); 
            // 加载轮播配置
            const slideshowConfig = await loadSlideshowConfigFromDB();
            const exportData = { 
                version:3, 
                exportTime: new Date().toISOString(), 
                bills, 
                buttonConfigs,
                slideshowConfig: slideshowConfig || { title: '📷📷📷📷📷📷', speed: 3, effect: 'fade' }
            }; 
            const blob = new Blob([JSON.stringify(exportData,null,2)], {type:'application/json'}); 
            const url = URL.createObjectURL(blob); 
            const a = document.createElement('a'); 
            a.href = url; 
            a.download = `Tim记账软件备份_${new Date().toISOString().slice(0,10)}.json`; 
            a.click(); 
            URL.revokeObjectURL(url); 
            showConfirm('✅ 导出成功', ()=>{}); 
        } catch(err){ 
            console.error('导出失败:', err);
            showConfirm('❌ 导出失败', ()=>{}); 
        } 
    }
    
    async function performImport(importData) { 
        try { 
            if (!importData.bills || !importData.buttonConfigs) throw new Error('无效格式'); 
            await clearAllBills(); 
            if (importData.bills.length) await bulkAddBills(importData.bills); 
            buttonConfigs = importData.buttonConfigs; 
            await saveButtonConfigsToDB(buttonConfigs); 
            
            // 导入轮播配置
            if (importData.slideshowConfig) {
                await saveSlideshowConfigToDB(importData.slideshowConfig);
            }
            
            await loadFromDB(); 
            showConfirm('✅ 导入成功', ()=>{}); 
        } catch(err){ 
            console.error('导入失败:', err);
            showConfirm('❌ 导入失败', ()=>{}); 
        } 
    }
    
    function importData(file) { 
        const reader = new FileReader(); 
        reader.onload = async (e) => { 
            try { 
                const importData = JSON.parse(e.target.result); 
                if (!importData.bills || !importData.buttonConfigs) throw new Error('无效'); 
                showConfirm(`确定导入？账单:${importData.bills.length}条，按钮:${importData.buttonConfigs.length}个`, (confirmed) => { 
                    if (confirmed) performImport(importData); 
                }); 
            } catch(err){ 
                console.error('导入文件错误:', err);
                showConfirm('❌ 导入文件错误', ()=>{}); 
            } 
        }; 
        reader.readAsText(file); 
    }

    async function saveButtonConfigs() { 
        if (!tempButtonConfigs.length) return; 
        const updatePromises = []; 
        document.querySelectorAll('.cost-btn').forEach((btn) => { 
            const ni = btn.querySelector('.btn-name-input'); 
            const originalName = btn.dataset.originalName; 
            if (ni && originalName) { 
                const newName = ni.value.trim() || '未命名'; 
                if (originalName !== newName && originalName) { 
                    updatePromises.push(updateBillNames(originalName, newName)); 
                } 
            } 
        }); 
        if (updatePromises.length) await Promise.all(updatePromises); 
        buttonConfigs = tempButtonConfigs.map(c => ({ ...c })); 
        await saveButtonConfigsToDB(buttonConfigs); 
        await loadFromDB(); 
    }

    async function performAccounting() { 
        const selectedItems = []; 
        document.querySelectorAll('.cost-btn.selected').forEach(btn => { 
            if (editMode) return; 
            const repairInput = btn.querySelector('.repair-input'); 
            if (repairInput) { 
                const nameSpan = btn.querySelector('.btn-name'); 
                const name = nameSpan ? nameSpan.innerText : '维修'; 
                const price = parseFloat(repairInput.value); 
                if (!isNaN(price) && price > 0) selectedItems.push({ name, price }); 
            } else { 
                const nameSpan = btn.querySelector('.btn-name'); 
                const priceSpan = btn.querySelector('.btn-price'); 
                if (nameSpan && priceSpan) { 
                    const name = nameSpan.innerText; 
                    const price = parseFloat(priceSpan.innerText.replace('¥', '')); 
                    if (!isNaN(price) && price > 0) selectedItems.push({ name, price }); 
                } 
            } 
        }); 
        
        if (!selectedItems.length) { 
            blinkUnselectedButtons(); 
            return; 
        } 
        
        const now = new Date(); 
        const datetimeStr = `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`; 
        const newRecords = selectedItems.map(p => { 
            let cost = 0; 
            const found = buttonConfigs.find(b => b.name === p.name); 
            if (found && found.cost !== undefined) cost = found.cost; 
            return { name: p.name, price: p.price, cost, datetime: datetimeStr, timestamp: Date.now() + Math.random() }; 
        }); 
        
        try { 
            await addBills(newRecords); 
            billRecords.push(...newRecords); 
            document.querySelectorAll('.cost-btn.selected').forEach(b => b.classList.remove('selected')); 
            updateSelectedTotal(); 
            resetToFirstPage(); 
            renderCurrentView(); 
            updateMonthlyChart(); 
        } catch (err) { 
            console.error(err); 
        } 
    }
    
    function blinkUnselectedButtons() { 
        document.querySelectorAll('.cost-btn:not(.selected)').forEach(btn => { 
            btn.classList.add('blink'); 
            setTimeout(() => btn.classList.remove('blink'), 300); 
        }); 
    }
    
    function updateSelectedTotal() { 
        let total = 0; 
        document.querySelectorAll('.cost-btn.selected').forEach(btn => { 
            if (editMode) { 
                const di = btn.querySelector('.btn-dual-input'); 
                if (di) total += parseFloat(di.value) || 0; 
            } else { 
                const ri = btn.querySelector('.repair-input'); 
                if (ri) total += parseFloat(ri.value) || 0; 
                else { 
                    const ps = btn.querySelector('.btn-price'); 
                    if (ps) total += parseFloat(ps.innerText.replace('¥','')) || 0; 
                } 
            } 
        }); 
        selectedTotal.innerText = '¥' + total.toFixed(1); 
    }
    
    function initSortable() { 
        if (sortableInstance) sortableInstance.destroy(); 
        sortableInstance = new Sortable(buttonContainer, { 
            animation:150, 
            handle:'.cost-btn', 
            draggable:'.cost-btn', 
            disabled:!editMode, 
            onEnd: function(evt) { 
                const items = Array.from(buttonContainer.children); 
                const newTemp = []; 
                items.forEach((item, idx) => { 
                    const ni = item.querySelector('.btn-name-input'); 
                    const di = item.querySelector('.btn-dual-input'); 
                    const oldIdx = item.getAttribute('data-index'); 
                    let old = (oldIdx && tempButtonConfigs[parseInt(oldIdx)]) ? tempButtonConfigs[parseInt(oldIdx)] : { name:'', price:0, cost:0, isRepair:false }; 
                    if (ni && di) { 
                        let price = old.price, cost = old.cost; 
                        const val = parseFloat(di.value) || 0; 
                        if (dualModeCost) cost = val; 
                        else price = val; 
                        newTemp.push({ name: ni.value.trim() || '未命名', price, cost, isRepair: old.isRepair }); 
                    } 
                }); 
                if (newTemp.length === tempButtonConfigs.length) { 
                    tempButtonConfigs = newTemp; 
                    items.forEach((it, idx) => it.setAttribute('data-index', idx)); 
                } 
                pendingDeleteIndex = -1; 
            } 
        }); 
    }

    function triggerDelete(index) { pendingDeleteIndex = index; renderButtons(true); }
    function cancelDelete() { pendingDeleteIndex = -1; renderButtons(true); }
    function confirmDelete(index) { if (tempButtonConfigs.length <= 1) return; tempButtonConfigs.splice(index,1); pendingDeleteIndex = -1; renderButtons(true); }

    function renderButtons(useTemp = false) { 
    const configs = useTemp ? tempButtonConfigs : buttonConfigs; 
    buttonContainer.innerHTML = ''; 
    configs.forEach((config, idx) => { 
        const btn = document.createElement('div'); 
        btn.className = 'cost-btn'; 
        btn.setAttribute('data-index', idx); 
        btn.dataset.originalName = config.name; 
        if (config.isRepair) btn.classList.add('repair-btn'); 
        if (editMode) { 
            if (pendingDeleteIndex === idx) { 
                const confirmBtn = document.createElement('span'); 
                confirmBtn.className = 'delete-confirm-btn'; 
                confirmBtn.innerText = '确认'; 
                confirmBtn.addEventListener('click', (e) => { 
                    e.stopPropagation(); 
                    confirmDelete(idx); 
                }); 
                const cancelBtn = document.createElement('span'); 
                cancelBtn.className = 'delete-cancel-btn'; 
                cancelBtn.innerText = '取消'; 
                cancelBtn.addEventListener('click', (e) => { 
                    e.stopPropagation(); 
                    cancelDelete(); 
                }); 
                btn.appendChild(confirmBtn); 
                btn.appendChild(cancelBtn); 
                btn.addEventListener('click', (e) => { 
                    if(e.target===confirmBtn||e.target===cancelBtn) return; 
                    btn.classList.toggle('selected'); 
                    updateSelectedTotal(); 
                }); 
            } else { 
                const ni = document.createElement('input'); 
                ni.type='text'; 
                ni.className='btn-name-input'; 
                ni.value = config.name; 
                ni.addEventListener('input', (e) => { 
                    tempButtonConfigs[idx].name = e.target.value.trim() || '未命名'; 
                }); 
                const di = document.createElement('input'); 
                di.type='number'; 
                di.className='btn-dual-input'; 
                di.value = dualModeCost ? (config.cost||0).toFixed(1) : config.price.toFixed(1); 
                di.min='0'; 
                di.step='0.5'; 
                if (dualModeCost) { 
                    di.classList.add('cost-input-style'); 
                    di.classList.remove('sales-input-style'); 
                } else { 
                    di.classList.add('sales-input-style'); 
                    di.classList.remove('cost-input-style'); 
                } 
                di.addEventListener('input', (e) => { 
                    const val = parseFloat(di.value) || 0; 
                    if (dualModeCost) { 
                        tempButtonConfigs[idx].cost = val; 
                    } else { 
                        tempButtonConfigs[idx].price = val; 
                    } 
                    if (btn.classList.contains('selected')) updateSelectedTotal(); 
                }); 
                btn.appendChild(ni); 
                btn.appendChild(di); 
                const del = document.createElement('span'); 
                del.className = 'delete-btn'; 
                del.innerHTML = '✕'; 
                del.addEventListener('click', (e) => { 
                    e.stopPropagation(); 
                    triggerDelete(idx); 
                }); 
                btn.appendChild(del); 
                btn.addEventListener('click', (e) => { 
                    if(e.target===ni || e.target===di || e.target===del) return; 
                    btn.classList.toggle('selected'); 
                    updateSelectedTotal(); 
                }); 
                [ni, di].forEach(inp => inp.addEventListener('click', e => e.stopPropagation())); 
            } 
        } else { 
            if (config.isRepair) { 
                const nameSpan = document.createElement('span'); 
                nameSpan.className = 'btn-name'; 
                nameSpan.innerText = config.name; 
                const inp = document.createElement('input'); 
                inp.type='number';

    function updateStatsDisplay() { 
        let total = 0, profit = 0; 
        if (currentStatsRange === 'day') { 
            const today = new Date().toISOString().slice(0,10); 
            total = billRecords.filter(r => r.datetime.startsWith(today)).reduce((sum, r) => sum + r.price, 0); 
            profit = billRecords.filter(r => r.datetime.startsWith(today)).reduce((sum, r) => sum + (r.price - (r.cost||0)), 0); 
        } else if (currentStatsRange === 'month') { 
            const curMonth = new Date().toISOString().slice(0,7); 
            total = billRecords.filter(r => r.datetime.slice(0,7) === curMonth).reduce((sum, r) => sum + r.price, 0); 
            profit = billRecords.filter(r => r.datetime.slice(0,7) === curMonth).reduce((sum, r) => sum + (r.price - (r.cost||0)), 0); 
        } else { 
            const curYear = new Date().getFullYear().toString(); 
            total = billRecords.filter(r => r.datetime.slice(0,4) === curYear).reduce((sum, r) => sum + r.price, 0); 
            profit = billRecords.filter(r => r.datetime.slice(0,4) === curYear).reduce((sum, r) => sum + (r.price - (r.cost||0)), 0); 
        } 
        if (profitMode) { 
            statsAmount.innerText = '利润 ¥' + profit.toFixed(1); 
        } else { 
            statsAmount.innerText = '¥' + total.toFixed(1); 
        } 
    }

    function bindRowEvents() { 
        document.querySelectorAll('[data-action="trigger"]').forEach(btn => { 
            btn.addEventListener('click', (e) => { 
                e.stopPropagation(); 
                const key = Number(btn.dataset.key); 
                activeDeleteItem = key; 
                activeEditItem = null; 
                renderCurrentView(); 
            }); 
        }); 
        
        document.querySelectorAll('[data-action="confirm"]').forEach(btn => { 
            btn.addEventListener('click', async (e) => { 
                e.stopPropagation(); 
                const key = Number(btn.dataset.key); 
                try { 
                    await deleteBill(key); 
                    billRecords = billRecords.filter(r => r.timestamp !== key); 
                    activeDeleteItem = null; 
                    renderCurrentView(); 
                    updateStatsDisplay(); 
                    updateMonthlyChart(); 
                } catch(err){} 
            }); 
        }); 
        
        document.querySelectorAll('[data-action="cancel"]').forEach(btn => { 
            btn.addEventListener('click', (e) => { 
                e.stopPropagation(); 
                activeDeleteItem = null; 
                renderCurrentView(); 
            }); 
        }); 
        
        document.querySelectorAll('[data-action="edit-trigger"]').forEach(btn => { 
            btn.addEventListener('click', (e) => { 
                e.stopPropagation(); 
                const key = Number(btn.dataset.key); 
                activeEditItem = key; 
                activeDeleteItem = null; 
                renderCurrentView(); 
            }); 
        }); 
        
        document.querySelectorAll('[data-action="edit-confirm"]').forEach(btn => { 
            btn.addEventListener('click', (e) => { 
                e.stopPropagation(); 
                const key = Number(btn.dataset.key); 
                const priceInput = document.getElementById(`edit-price-${key}`); 
                const costInput = document.getElementById(`edit-cost-${key}`); 
                if (priceInput && costInput) { 
                    const newPrice = parseFloat(priceInput.value); 
                    const newCost = parseFloat(costInput.value); 
                    if (!isNaN(newPrice) && !isNaN(newCost)) handleEditConfirm(key, newPrice, newCost); 
                } 
            }); 
        }); 
        
        document.querySelectorAll('[data-action="edit-cancel"]').forEach(btn => { 
            btn.addEventListener('click', (e) => { 
                e.stopPropagation(); 
                activeEditItem = null; 
                renderCurrentView(); 
            }); 
        }); 
    }
    
    async function handleEditConfirm(timestamp, newPrice, newCost) { 
        const record = billRecords.find(r => r.timestamp === timestamp); 
        if (!record) return; 
        record.price = newPrice; 
        record.cost = newCost; 
        try { 
            await updateBill(record); 
            activeEditItem = null; 
            renderCurrentView(); 
            updateMonthlyChart(); 
        } catch (err) { 
            console.error(err); 
        } 
    }

    function getMonthlyData() {
        const months = Array.from({ length: 12 }, (_, i) => (i + 1).toString().padStart(2, '0'));
        const currentYear = new Date().getFullYear().toString();
        const salesData = months.map(month => {
            const monthStr = `${currentYear}-${month}`;
            return billRecords.filter(r => r.datetime.startsWith(monthStr)).reduce((sum, r) => sum + r.price, 0);
        });
        const profitData = months.map(month => {
            const monthStr = `${currentYear}-${month}`;
            return billRecords.filter(r => r.datetime.startsWith(monthStr)).reduce((sum, r) => sum + (r.price - (r.cost || 0)), 0);
        });
        return { salesData, profitData };
    }

                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(200,200,220,0.1)' },
                        ticks: { font: { size: 7.5 }, color: '#b0b0d0', stepSize: 200, callback: (val) => val }
                    }
                }
            }
        });
    }

    // 修改 loadFromDB 函数，加载轮播配置
    async function loadFromDB() { 
        try { 
            console.log('开始从数据库加载数据...');
            // 确保数据库已打开
            if (!db) {
                console.log('数据库未就绪，等待打开...');
                await openDB();
            }
            
            const [records, saved, slideshowConfig] = await Promise.all([
                getAllBills(), 
                loadButtonConfigsFromDB(),
                loadSlideshowConfigFromDB()
            ]); 
            
            billRecords = records; 
            console.log('加载账单数量:', records.length);
            
            if (saved) {
                buttonConfigs = saved; 
                console.log('加载按钮配置:', saved.length);
            } else { 
                buttonConfigs = JSON.parse(JSON.stringify(defaultButtonConfigs)); 
                console.log('使用默认按钮配置');
            } 
            
            // 加载轮播配置
            if (slideshowConfig) {
                slideshowTitle.value = slideshowConfig.title || '📷📷📷📷📷📷';
                slideshowTitleInput.value = slideshowConfig.title || '📷 本地图片轮播';
                slideshowSpeedInput.value = slideshowConfig.speed || 3;
                slideshowSpeed = slideshowConfig.speed || 3;
                
                // 设置特效
                if (slideshowConfig.effect) {
                    currentEffect = slideshowConfig.effect;
                    const effectOption = document.querySelector(`.effect-option[data-value="${slideshowConfig.effect}"]`);
                    if (effectOption) {
                        document.querySelectorAll('.effect-option').forEach(o => o.classList.remove('selected'));
                        effectOption.classList.add('selected');
                        selectedEffect.textContent = effectOption.textContent;
                    }
                }
            }
            
            resetToFirstPage(); 
            renderButtons(false); 
            if (!editMode) renderCurrentView(); 
            updateStatsDisplay(); 
            statsDayBtn.classList.add('active'); 
            statsMonthBtn.classList.remove('active'); 
            statsYearBtn.classList.remove('active'); 
            updateMonthlyChart(); 
            
            // 重启轮播定时器
            if (slideshowImages.length > 1) {
                restartSlideshowTimer();
            }
            
        } catch(e){ 
            console.error('加载数据失败:', e); 
            buttonConfigs = JSON.parse(JSON.stringify(defaultButtonConfigs)); 
            renderButtons(false); 
            updateStatsDisplay(); 
            statsDayBtn.classList.add('active'); 
            updateMonthlyChart(); 
        } 
    }
    
    async function initDB() { 
        try { 
            console.log('初始化数据库...');
            await openDB(); 
            await loadFromDB(); 
            updateSelectedTotal(); 
            console.log('数据库初始化完成');
        } catch(e){ 
            console.error('数据库初始化失败，使用默认配置:', e); 
            buttonConfigs = JSON.parse(JSON.stringify(defaultButtonConfigs)); 
            renderButtons(false); 
            updateSelectedTotal(); 
            statsDayBtn.classList.add('active'); 
            updateMonthlyChart(); 
        } 
    }

    // ---------- 轮播图功能 ----------
    function scanLocalImages() {
        const commonNames = [
            '1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg',
            '6.jpg', '7.jpg', '8.jpg', '9.jpg', '10.jpg',
            '11.jpg', '12.jpg', '13.jpg', '14.jpg', '15.jpg',
            '16.jpg', '17.jpg', '18.jpg', '19.jpg', '20.jpg',
            '1.png', '2.png', '3.png', '4.png', '5.png',
            'bg.jpg', 'background.jpg', 'cover.jpg', 'photo.jpg',
            'image1.jpg', 'image2.jpg', 'image3.jpg', 'image4.jpg', 'image5.jpg',
            'pic1.jpg', 'pic2.jpg', 'pic3.jpg', 'pic4.jpg', 'pic5.jpg',
            'img1.jpg', 'img2.jpg', 'img3.jpg', 'img4.jpg', 'img5.jpg',
            '1.jpeg', '2.jpeg', '3.jpeg', '4.jpeg', '5.jpeg',
            '1.webp', '2.webp', '3.webp', '4.webp', '5.webp',
            '1.gif', '2.gif', '3.gif', '4.gif', '5.gif'
        ];
        
        const foundUrls = [];
        const promises = [];
        
        commonNames.forEach(filename => {
            const img = new Image();
            const promise = new Promise((resolve) => {
                img.onload = () => {
                    foundUrls.push(filename);
                    resolve(true);
                };
                img.onerror = () => resolve(false);
                img.src = filename;
            });
            promises.push(promise);
        });
        
        Promise.all(promises).then(() => {
            if (foundUrls.length > 0) {
                slideshowImages = foundUrls;
                currentSlideIndex = 0;
                updateSlideshowDisplay();
                if (slideshowImages.length > 1) startSlideshowTimer();
            } else {
                slideshowImages = [];
                updateSlideshowDisplay();
            }
        });
    }

    // 应用特效
    function applyEffect(element, effect, callback) {
        if (!element) return;
        
        const effectClasses = [
            'effect-fade-out', 'effect-fade-in',
            'effect-zoom-out', 'effect-zoom-in',
            'effect-slide-left', 'effect-slide-right', 'effect-slide-up', 'effect-slide-down',
            'effect-rotate', 'effect-flip', 'effect-blur',
            'effect-shake', 'effect-pulse', 'effect-3d-spin', 'effect-bounce'
        ];
        effectClasses.forEach(cls => element.classList.remove(cls));
        
        void element.offsetWidth;
        
        switch(effect) {
            case 'fade':
                element.classList.add('effect-fade-out');
                setTimeout(() => {
                    element.classList.remove('effect-fade-out');
                    element.classList.add('effect-fade-in');
                    setTimeout(() => {
                        element.classList.remove('effect-fade-in');
                        if (callback) callback();
                    }, 300);
                }, 100);
                break;
                
            case 'zoom-out':
                element.classList.add('effect-zoom-out');
                setTimeout(() => {
                    element.classList.remove('effect-zoom-out');
                    if (callback) callback();
                }, 400);
                break;
                
            case 'zoom-in':
                element.classList.add('effect-zoom-in');
                setTimeout(() => {
                    element.classList.remove('effect-zoom-in');
                    if (callback) callback();
                }, 400);
                break;
                
            case 'slide-left':
                element.classList.add('effect-slide-left');
                setTimeout(() => {
                    element.classList.remove('effect-slide-left');
                    if (callback) callback();
                }, 400);
                break;
                
            case 'slide-right':
                element.classList.add('effect-slide-right');
                setTimeout(() => {
                    element.classList.remove('effect-slide-right');
                    if (callback) callback();
                }, 400);
                break;
                
            case 'slide-up':
                element.classList.add('effect-slide-up');
                setTimeout(() => {
                    element.classList.remove('effect-slide-up');
                    if (callback) callback();
                }, 400);
                break;
                
            case 'slide-down':
                element.classList.add('effect-slide-down');
                setTimeout(() => {
                    element.classList.remove('effect-slide-down');
                    if (callback) callback();
                }, 400);
                break;
                
            case 'rotate':
                element.classList.add('effect-rotate');
                setTimeout(() => {
                    element.classList.remove('effect-rotate');
                    if (callback) callback();
                }, 500);
                break;
                
            case 'flip':
                element.classList.add('effect-flip');
                setTimeout(() => {
                    element.classList.remove('effect-flip');
                    if (callback) callback();
                }, 500);
                break;
                
            case 'blur':
                element.classList.add('effect-blur');
                setTimeout(() => {
                    element.classList.remove('effect-blur');
                    if (callback) callback();
                }, 400);
                break;
                
            case 'shake':
                element.classList.add('effect-shake');
                setTimeout(() => {
                    element.classList.remove('effect-shake');
                    if (callback) callback();
                }, 500);
                break;
                
            case 'pulse':
                element.classList.add('effect-pulse');
                setTimeout(() => {
                    element.classList.remove('effect-pulse');
                    if (callback) callback();
                }, 800);
                break;
                
            case '3d-spin':
                element.classList.add('effect-3d-spin');
                setTimeout(() => {
                    element.classList.remove('effect-3d-spin');
                    if (callback) callback();
                }, 600);
                break;
                
            case 'bounce':
                element.classList.add('effect-bounce');
                setTimeout(() => {
                    element.classList.remove('effect-bounce');
                    if (callback) callback();
                }, 600);
                break;
                
            default:
                if (callback) callback();
        }
    }

    function updateSlideshowDisplay() {
        if (!slideshowImages.length) {
            slideshowImg.style.display = 'none';
            slideshowPlaceholder.style.display = 'flex';
            slideshowIndexSpan.innerText = '0/0';
            return;
        }
        
        if (currentSlideIndex < 0) currentSlideIndex = 0;
        if (currentSlideIndex >= slideshowImages.length) currentSlideIndex = slideshowImages.length - 1;
        
        const url = slideshowImages[currentSlideIndex];
        
        if (isTransitioning) return;
        
        isTransitioning = true;
        
        applyEffect(slideshowImg, currentEffect, () => {
            slideshowImg.src = url;
            slideshowImg.style.display = 'block';
            slideshowPlaceholder.style.display = 'none';
            slideshowIndexSpan.innerText = `${currentSlideIndex+1}/${slideshowImages.length}`;
            isTransitioning = false;
        });
    }

    function startSlideshowTimer() {
        if (slideshowTimer) clearInterval(slideshowTimer);
        if (slideshowImages.length > 1) {
            slideshowTimer = setInterval(() => {
                if (!isTransitioning) {
                    currentSlideIndex = (currentSlideIndex + 1) % slideshowImages.length;
                    updateSlideshowDisplay();
                }
            }, slideshowSpeed * 1000);
        }
    }

    function stopSlideshowTimer() {
        if (slideshowTimer) {
            clearInterval(slideshowTimer);
            slideshowTimer = null;
        }
    }

    function restartSlideshowTimer() {
        stopSlideshowTimer();
        startSlideshowTimer();
    }

    // 初始化自定义下拉菜单
    function initCustomSelect() {
        effectOptions.forEach(opt => {
            if (opt.dataset.value === currentEffect) {
                opt.classList.add('selected');
                selectedEffect.textContent = opt.textContent;
            }
        });

        effectSelectArea.addEventListener('click', (e) => {
            e.stopPropagation();
            effectDropdown.classList.toggle('show');
        });

        effectOptions.forEach(opt => {
            opt.addEventListener('click', (e) => {
                e.stopPropagation();
                const value = opt.dataset.value;
                const text = opt.textContent;
                
                effectOptions.forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                
                selectedEffect.textContent = text;
                currentEffect = value;
                
                effectDropdown.classList.remove('show');
                
                // 立即应用特效到当前图片
                if (slideshowImages.length > 0) {
                    updateSlideshowDisplay();
                }

                // 新增：实时保存配置到数据库
                persistSlideshowConfig();
            });
        });

        document.addEventListener('click', () => {
            effectDropdown.classList.remove('show');
        });
    }

    // 新增：立即保存轮播配置到数据库并生效
    function persistSlideshowConfig() {
        if (!db) return;
        const config = {
            title: slideshowTitleInput.value,
            speed: parseFloat(slideshowSpeedInput.value) || 3,
            effect: currentEffect
        };
        saveSlideshowConfigToDB(config).catch(e => console.warn('保存轮播配置失败', e));
    }

    // 事件绑定
    slideshowPrev.addEventListener('click', () => {
        if (!slideshowImages.length || isTransitioning) return;
        currentSlideIndex = (currentSlideIndex - 1 + slideshowImages.length) % slideshowImages.length;
        updateSlideshowDisplay();
        restartSlideshowTimer();
    });

    slideshowNext.addEventListener('click', () => {
        if (!slideshowImages.length || isTransitioning) return;
        currentSlideIndex = (currentSlideIndex + 1) % slideshowImages.length;
        updateSlideshowDisplay();
        restartSlideshowTimer();
    });

    slideshowSpeedInput.addEventListener('input', (e) => {
        let val = parseFloat(e.target.value);
        if (isNaN(val) || val < 0.5) val = 0.5;
        if (val > 10) val = 10;
        slideshowSpeed = val;
        slideshowSpeedInput.value = val;
        if (slideshowImages.length > 1) {
            restartSlideshowTimer();
        }
        persistSlideshowConfig(); // 保存速度
    });

    slideshowTitleInput.addEventListener('input', (e) => {
        slideshowTitle.value = e.target.value;
        persistSlideshowConfig();
    });

    slideshowTitle.addEventListener('input', (e) => {
        slideshowTitleInput.value = e.target.value;
        persistSlideshowConfig();
    });

    // 初始化
    initCustomSelect();

    addNormalBtnNew.addEventListener('click', ()=>{ if(editMode) addNewButton(false); });
    addRepairBtnNew.addEventListener('click', ()=>{ if(editMode) addNewButton(true); });
    exportDataBtnNew.addEventListener('click', exportData);
    importDataBtnNew.addEventListener('click', ()=> importFile.click());
    importFile.addEventListener('change', (e)=>{ if(e.target.files[0]){ importData(e.target.files[0]); importFile.value=''; } });

    prevBtn.addEventListener('click', ()=>{ 

        if(currentPage > 1) { 
            currentPage--; 
            activeDeleteItem = null; 
            activeEditItem = null; 
            renderCurrentView(); 
        } 
    });
    
    nextBtn.addEventListener('click', ()=>{ 
    
        let totalPages = 1; 
        if (currentViewLevel === 'main') {
            if (currentStatsRange === 'day') totalPages = Math.max(1, Math.ceil(billRecords.length / PAGE_SIZE));
            else if (currentStatsRange === 'month') {
                const months = [...new Set(billRecords.map(r => r.datetime.slice(0,7)))];
                totalPages = Math.max(1, Math.ceil(months.length / PAGE_SIZE));
            } else {
                const years = [...new Set(billRecords.map(r => r.datetime.slice(0,4)))];
                totalPages = Math.max(1, Math.ceil(years.length / PAGE_SIZE));
            }
        } else if (currentViewLevel === 'month-summary' && currentDetailsParam) {
            const monthRecords = billRecords.filter(r => r.datetime.slice(0,7) === currentDetailsParam);
            const items = [...new Set(monthRecords.map(r => r.name))];
            totalPages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
        } else if (currentViewLevel === 'year-detail' && currentDetailsParam) {
            const months = [...new Set(billRecords.filter(r => r.datetime.slice(0,4) === currentDetailsParam).map(r => r.datetime.slice(0,7)))];
            totalPages = Math.max(1, Math.ceil(months.length / PAGE_SIZE));
        }
        if(currentPage < totalPages) { 
            currentPage++; 
            activeDeleteItem = null; 
            activeEditItem = null; 
            renderCurrentView(); 
        } 
    });

    statsDayBtn.addEventListener('click', ()=>{ 
       
        [statsDayBtn, statsMonthBtn, statsYearBtn].forEach(b => b.classList.remove('active')); 
        statsDayBtn.classList.add('active'); 
        currentStatsRange = 'day'; 
        resetToFirstPage(); 
        renderCurrentView(); 
    });
    
    statsMonthBtn.addEventListener('click', ()=>{ 
        
        [statsDayBtn, statsMonthBtn, statsYearBtn].forEach(b => b.classList.remove('active')); 
        statsMonthBtn.classList.add('active'); 
        currentStatsRange = 'month'; 
        resetToFirstPage(); 
        renderCurrentView(); 
    });
    
    statsYearBtn.addEventListener('click', ()=>{ 

        [statsDayBtn, statsMonthBtn, statsYearBtn].forEach(b => b.classList.remove('active')); 
        statsYearBtn.classList.add('active'); 
        currentStatsRange = 'year'; 
        resetToFirstPage(); 
        renderCurrentView(); 
    });

    // 启动应用
    window.addEventListener('load', ()=>{ 
        console.log('页面加载完成，启动应用...');
        initDB();
        setTimeout(() => {
            scanLocalImages();
        }, 500);
    });
})();
